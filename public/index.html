<!doctype html>
<!--
  Web only: the page that wraps the app in a browser (phones never use this file).
  Expo injects the app <script> automatically. Files in public/ are served at the site root.
  Favicon / apple-touch-icon are generated by scripts/make_icons.py.
  The background colours must match src/components/theme.ts (avoids a white flash in dark mode).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#FF4D26" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Web map styles (copy of node_modules/leaflet/dist — update the copy if leaflet is upgraded) -->
    <link rel="stylesheet" href="/leaflet/leaflet.css" />
    <title>Convoy</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        background-color: #f7f3ee;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #121110;
        }
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>
  </body>
</html>
